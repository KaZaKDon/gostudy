# Included inside the existing GoStudy server block; TLS, SSE, API and
# security headers remain in the existing configuration.

rewrite ^/(agreement|privacy|rules|offer)/?$ /legal/$1 permanent;
rewrite ^/(payment|refund)/?$ /payment-and-refunds permanent;
rewrite ^/(about|students|teachers|pricing|payment-and-refunds|requisites|support)\.html$ /$1 permanent;
rewrite ^/legal/(agreement|privacy|rules|offer|tariffs|personal-data-consent|parent-child-data-consent|marketing-consent)\.html$ /legal/$1 permanent;
rewrite ^/(about|students|teachers|pricing|payment-and-refunds|requisites|support)/$ /$1 permanent;
rewrite ^/legal/(agreement|privacy|rules|offer|tariffs|personal-data-consent|parent-child-data-consent|marketing-consent)/$ /legal/$1 permanent;

error_page 404 /404.html;

location = / {
    proxy_pass http://127.0.0.1:3002/api/v1/public-pages/site?path=/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
location = /index.html {
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }
    return 301 /$is_args$args;
}

# The tariff is rendered from the current DB publication for every visitor,
# not just for bots. Preserve the no-store header returned by the API.
location = /pricing {
    proxy_pass http://127.0.0.1:3002/api/v1/public-pages/pricing;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_cache off;
}

location ~ ^/(about|students|teachers|payment-and-refunds|requisites|support)$ {
    proxy_pass http://127.0.0.1:3002/api/v1/public-pages/site?path=$uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ~ ^/legal/(agreement|privacy|rules|offer|tariffs|personal-data-consent|parent-child-data-consent|marketing-consent)$ {
    proxy_pass http://127.0.0.1:3002/api/v1/public-pages/site?path=$uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

# spa.html contains noindex from the first byte and no home canonical.
# robots.txt allows crawling these shells so noindex is actually readable.
location ~ ^/(login|register|password-reset|profile-start|account|verify-email)/?$ {
    try_files /spa.html =404;
}
location ~ ^/classroom/[1-9][0-9]*/?$ { try_files /spa.html =404; }
location ~ ^/admin(?:/.*)?$ { try_files /spa.html =404; }

location = /spa.html {
    internal;
    expires -1;
}
location = /404 { return 404; }
location = /404/ { return 404; }
location = /404.html { internal; }
location = /sitemap.php { return 301 /sitemap.xml$is_args$args; }

# Hashed assets and API routes keep their existing locations. Unknown
# application paths are not silently rewritten to the homepage.
location / { try_files $uri =404; }
